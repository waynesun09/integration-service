name: Triage Agent
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan issue for prompt injection
        id: injection-scan
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run prompt injection classifier
        id: scan
        run: |
          pip install -q transformers torch
          python3 -c "
          from transformers import AutoTokenizer, AutoModelForSequenceClassification
          import torch, os

          model_id = 'meta-llama/Llama-Prompt-Guard-2-22M'
          tokenizer = AutoTokenizer.from_pretrained(model_id)
          model = AutoModelForSequenceClassification.from_pretrained(model_id)

          text = os.environ['ISSUE_TEXT']
          inputs = tokenizer(text, return_tensors='pt', truncation=True, max_length=512)
          with torch.no_grad():
              logits = model(**inputs).logits
          probs = torch.softmax(logits, dim=-1)
          # Labels: 0=BENIGN, 1=INJECTION, 2=JAILBREAK
          injection_score = probs[0][1].item() + probs[0][2].item()
          label = 'INJECTION' if injection_score > 0.5 else 'BENIGN'
          print(f'Classification: {label} (score: {injection_score:.3f})')

          if label == 'INJECTION':
              print('::error::Prompt injection detected')
              print('detected=true', file=open(os.environ['GITHUB_OUTPUT'], 'a'))
          else:
              print('detected=false', file=open(os.environ['GITHUB_OUTPUT'], 'a'))
          "
        env:
          ISSUE_TEXT: ${{ github.event.issue.title }} ${{ github.event.issue.body }}

      - name: Flag injected issue
        if: steps.scan.outputs.detected == 'true'
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "⚠️ **Prompt injection detected.** This issue has been flagged by automated scanning and will not be processed by the agent. A human maintainer will review it."
          gh issue edit ${{ github.event.issue.number }} \
            --add-label "security/prompt-injection"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Triage issue
        if: steps.scan.outputs.detected != 'true'
        uses: google-github-actions/run-gemini-cli@v1
        with:
          gemini_api_key: ${{ secrets.AI_API_KEY }}
          gemini_model: gemini-3-flash-preview
          prompt: |
            Read the GEMINI.md file for project context.
            Read the .gemini/commands/triage-issue.md skill for detailed instructions.

            Triage GitHub issue #${{ github.event.issue.number }}.

            Issue title: "${{ github.event.issue.title }}"

            Use `gh issue view ${{ github.event.issue.number }}` to read the full issue body.
            Then follow the triage-issue skill steps to classify and label it.
          upload_artifacts: 'true'
          github_issue_number: '${{ github.event.issue.number }}'
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
