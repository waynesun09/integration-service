name: Review Agent
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review pull request
        uses: redhat-community-ai-tools/cicaddy-action@v0.3.2
        with:
          ai-provider: gemini
          ai-model: gemini-2.5-pro
          ai-api-key: ${{ secrets.AI_API_KEY }}
          task-prompt: |
            Review pull request #${{ github.event.pull_request.number }}.

            Review for:
            1. **Correctness** — does the code do what the PR description says?
            2. **Security** — any injection, privilege escalation, RBAC issues?
            3. **Style** — does it follow existing code patterns in the repo?
            4. **Tests** — are new functions tested? Edge cases covered?
            5. **Kubernetes conventions** — proper error handling, status updates, RBAC markers?

            Post a structured review. If changes are needed, request changes.
            If everything looks good, approve the PR.
          context: |
            {
              "PR_NUMBER": "${{ github.event.pull_request.number }}",
              "PR_TITLE": "${{ github.event.pull_request.title }}",
              "PR_AUTHOR": "${{ github.event.pull_request.user.login }}"
            }
          enable-local-tools: 'true'
          notification-mode: public
          github-token: ${{ secrets.GITHUB_TOKEN }}
